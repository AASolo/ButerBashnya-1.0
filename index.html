<style>
/* Layout: full-screen canvas; the sky darkens from day to space as the tower grows; chunky cartoon cards for menus. Deliberately single bright look. */
:root{
  --ink:#1b2140; --muted:#59618a; --paper:#ffffff; --line:rgba(27,33,64,.12); --soft:#f1f4ff;
  --tomato:#ff4d3d; --tomato-d:#c9291b; --sun:#ffc42e; --sun-d:#d99a00; --leaf:#4cc35a;
  --font:"Rubik","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:#8fd8ff;color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
button{touch-action:manipulation;font-family:var(--font)}
#app{position:relative;height:100%}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:pointer}
.hud{position:absolute;left:0;right:0;top:0;padding:12px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;pointer-events:none}
.floors{font-weight:900;font-size:clamp(44px,12vw,64px);line-height:1;color:var(--paper);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);font-variant-numeric:tabular-nums;text-align:center;transition:transform .12s}
.floors.pop{transform:scale(1.18)}
.coins{justify-self:start;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--paper);border:2px solid var(--ink);font-weight:900;font-size:16px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--ink)}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--sun);border:2px solid var(--sun-d);box-shadow:inset 0 -2px 0 var(--sun-d);flex:none}
.tools{justify-self:end;display:flex;gap:8px}
.icon{pointer-events:auto;width:44px;height:44px;border-radius:14px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.icon svg{width:20px;height:20px}
.icon:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;padding:16px;overflow-y:auto;background:rgba(27,33,64,.28)}
.overlay.clear{background:transparent}
.card{width:min(100%,420px);display:grid;gap:16px;padding:22px 20px;border-radius:26px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 8px 0 var(--ink);margin:auto;box-sizing:border-box;min-width:0}
.logo{margin:0;font-weight:900;font-size:clamp(38px,11vw,52px);line-height:.95;color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);text-align:center;letter-spacing:-.01em}
.sub{margin:0;text-align:center;color:var(--muted);font-weight:500;line-height:1.45;text-wrap:balance}
.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--soft);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.label{font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{display:grid;gap:2px;justify-items:center;padding:10px 4px;border-radius:14px;background:var(--soft);text-align:center}
.stat b{font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.stat b .coin{width:15px;height:15px;border-width:1.5px}
.stat small{font-size:11px;font-weight:700;color:var(--muted);line-height:1.2}
.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:360px){.themes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.theme{display:grid;gap:6px;justify-items:center;padding:10px 8px;border-radius:16px;border:2px solid var(--line);background:#f8f9ff;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink)}
.theme canvas{width:100%;max-width:120px;height:52px}
.theme small{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:4px}
.theme small .coin{width:14px;height:14px;border-width:1.5px}
.theme[aria-pressed="true"]{border-color:var(--ink);background:#fff6d6;box-shadow:0 3px 0 var(--ink)}
.theme.locked canvas{filter:grayscale(1);opacity:.45}
.theme.buyable small{color:var(--tomato-d)}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tg{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:14px;border:2px solid var(--line);background:#f8f9ff;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer}
.tg i{width:34px;height:20px;border-radius:999px;background:#cfd4e6;position:relative;transition:background .15s}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--paper);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tg[aria-pressed="true"] i{background:var(--leaf)}
.tg[aria-pressed="true"] i::after{transform:translateX(14px)}
.btns{display:grid;gap:10px}
.btn{border:3px solid var(--ink);border-radius:18px;padding:14px;font-weight:900;font-size:19px;cursor:pointer;background:var(--tomato);color:var(--paper);box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 var(--tomato-d)}
.btn.alt{background:var(--sun);color:var(--ink);text-shadow:none}
.btn.ghost{background:var(--paper);color:var(--ink);text-shadow:none;font-size:16px;padding:11px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn:focus-visible,.icon:focus-visible,.theme:focus-visible,.tg:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}
.hint{margin:0;text-align:center;font-size:13px;color:var(--muted)}
.big{text-align:center;display:grid;gap:2px}
.big b{font-weight:900;font-size:64px;line-height:1;color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);font-variant-numeric:tabular-nums}
.big span{font-weight:700;color:var(--muted)}
.badge{justify-self:center;padding:6px 14px;border-radius:999px;background:var(--tomato);color:var(--paper);font-weight:900;font-size:14px;letter-spacing:.04em;transform:rotate(-3deg);border:2px solid var(--ink)}
.shot{width:100%;max-width:300px;justify-self:center;border-radius:16px;border:2px solid var(--ink);aspect-ratio:4/5;object-fit:cover;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.tip{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:var(--paper);border:2px solid var(--ink);font-weight:700;font-size:15px;pointer-events:none;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
@media (prefers-reduced-motion:no-preference){.tip{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translate(-50%,-5px)}}}
/* menu: hero burger on the card's edge, waving logo, shiny play button, daily countdown, tips */
#menu{padding-top:calc(96px + env(safe-area-inset-top,0px))}
#menu .card{gap:12px}
@media (max-height:820px){#menu .sub{display:none}}
.hero{display:block;width:100%;height:140px;margin:-110px 0 -38px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.logo .w{display:inline-block;white-space:nowrap}
.logo .ch{display:inline-block}
.btn small{display:block;font-size:12px;font-weight:700;opacity:.8;margin-top:2px;text-shadow:none;font-variant-numeric:tabular-nums}
.btn.shine{position:relative;overflow:hidden}
.theme small svg{width:11px;height:11px}
.theme{font-size:13px;padding:8px 4px}
.tipline{margin:0;min-height:2.6em;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:13px;font-weight:700;color:var(--muted);transition:opacity .35s}
.tipline b{flex:none;padding:2px 8px;border-radius:999px;background:var(--sun);color:var(--ink);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){
  .logo .ch{animation:wave 2.6s ease-in-out infinite;animation-delay:calc(var(--i) * 90ms)}
  @keyframes wave{0%,55%,100%{transform:translateY(0)}25%{transform:translateY(-7px) rotate(-3deg)}}
  .btn.shine::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3s ease-in-out infinite}
  @keyframes shine{0%,55%{left:-60%}100%{left:130%}}
  .card{animation:cardIn .45s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes cardIn{from{transform:translateY(24px) scale(.97)}}
}
@media (hover:hover){.btn:hover,.theme:hover,.tg:hover,.icon:hover{filter:brightness(1.06)}.btn:hover{transform:translateY(-1px)}}
/* short landscape screens (phone on its side): compact menus without scrolling */
@media (max-height:540px) and (orientation:landscape){
  .card{width:min(100%,680px);gap:10px;padding:14px 18px;box-shadow:0 5px 0 var(--ink)}
  .logo{font-size:34px}
  .sub,.hint,.hero,.tipline{display:none}
  #menu{padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .label{font-size:11px}
  .stat{padding:6px 4px}.stat b{font-size:17px}
  .themes{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .theme{padding:6px;gap:2px}.theme canvas{height:40px}
  .tg{padding:7px}
  .btns{grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
  .btn{padding:10px;font-size:16px}.btn.ghost{padding:10px;font-size:14px}
  .big b{font-size:44px}
  .shot{max-width:150px}
  #over .card{grid-template-columns:auto 1fr;align-items:center;column-gap:18px}
  #over .shot{grid-row:1/span 4;grid-column:1}
  #over .card>*:not(.shot){grid-column:2}
  .floors{font-size:40px}
  .tip{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
}

body{margin:0}
.hud{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.overlay{padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="coins"><i class="coin"></i><span id="hCoins">0</span></div>
    <div class="floors" id="hFloors">0</div>
    <div class="tools">
      <button class="icon" id="muteBtn" aria-label="Звук"></button>
      <button class="icon" id="pauseBtn" aria-label="Пауза"><svg viewBox="0 0 20 20" fill="currentColor"><rect x="4" y="3" width="4" height="14" rx="1.5"/><rect x="12" y="3" width="4" height="14" rx="1.5"/></svg></button>
    </div>
  </div>
  <div class="tip" id="tip" hidden>Нажми, чтобы уронить</div>

  <div class="overlay clear" id="menu">
    <div class="card">

      <h1 class="logo" id="logo" aria-label="Бутербашня">Бутербашня</h1>
      <p class="sub">Нажимай, когда слой ровно над башней. Всё лишнее отвалится!</p>
      <div class="btns">

        <button class="btn alt" id="dailyBtn">Вызов дня</button>

        <div class="stat"><b id="sBest">0</b><small>лучшая башня</small></div>

        <div class="stat"><b id="sGames">0</b><small>игр</small></div>
        <div class="stat"><b><i class="coin"></i><span id="sCoins">0</span></b><small>монет</small></div>
      </div>
      <div class="label">Набор</div>
      <div class="themes" id="themes"></div>
      <div class="toggles">
        <button class="tg" id="sfxTg" aria-pressed="true"><i></i>Звуки</button>
        <button class="tg" id="musTg" aria-pressed="true"><i></i>Музыка</button>
      </div>
      <p class="tipline" id="tipLine"><b>Совет</b><span id="tipText">Играй пальцем, мышкой или пробелом</span></p>
    </div>
  </div>

  <div class="overlay" id="paused" hidden>
    <div class="card">
      <h2 class="logo" style="font-size:40px">Пауза</h2>
      <div class="btns">
        <button class="btn" id="resumeBtn">Продолжить</button>
        <button class="btn ghost" id="quitBtn">В меню</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="card">
      <div class="big"><b id="oFloors">0</b><span id="oWord">этажей</span></div>
      <div class="badge" id="oBadge" hidden>Новый рекорд!</div>
      <div class="row"><span class="pill"><i class="coin"></i>+<b id="oCoins">0</b></span><span class="pill">Идеальных: <b id="oPerf">0</b></span><span class="pill">Лучшая серия: <b id="oCombo">0</b></span></div>
      <img class="shot" id="oShot" alt="Картинка твоей башни для сторис">
      <p class="hint">Зажми картинку, чтобы сохранить и выложить в сторис</p>
      <div class="btns">
        <button class="btn" id="againBtn">Ещё раз</button>
        <button class="btn ghost" id="copyBtn">Скопировать текст</button>
        <button class="btn ghost" id="menuBtn">В меню</button>
      </div>
    </div>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()}}
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;

const THEMES=[
 {id:'burger',name:'Бургер',price:0,sky:['#7fd0ff','#d8f4ff'],table:'#c98a4b',
  base:{c:'#eaa24c',e:'#c4792a',h:26,d:'sesame',r:13},
  layers:[{c:'#7a4425',e:'#53301a',h:20,d:'grill'},{c:'#ffd23f',e:'#f0b400',h:11,d:'drip'},{c:'#5fd068',e:'#3aa346',h:11,d:'wave'},
          {c:'#ff5a4a',e:'#d63a2c',h:13,d:'seeds'},{c:'#f3e6ff',e:'#c8afe6',h:10,d:'ring'},{c:'#eaa24c',e:'#c4792a',h:16,d:'none'}]},
 {id:'pancake',name:'Блинчики',price:80,sky:['#ffb08a','#ffe6d6'],table:'#7d8fd6',
  base:{c:'#ffffff',e:'#cfd8e8',h:12,d:'none',r:6},
  layers:[{c:'#f2b45c',e:'#c9852e',h:14,d:'none'},{c:'#e8a248',e:'#b9741f',h:14,d:'none'},{c:'#7b5cff',e:'#5638d6',h:11,d:'dots'},
          {c:'#fff0a0',e:'#ead35a',h:9,d:'none'},{c:'#9c5a1c',e:'#6e3c0c',h:8,d:'drip'}]},
 {id:'cake',name:'Торт',price:200,sky:['#c9a8ff','#f1e8ff'],table:'#ff8fb8',
  base:{c:'#ffffff',e:'#d4d9ea',h:12,d:'none',r:6},
  layers:[{c:'#ff9ec7',e:'#e06f9f',h:18,d:'none'},{c:'#8a4b2f',e:'#5f2f1a',h:18,d:'none'},{c:'#ffe7a3',e:'#e9c35d',h:18,d:'none'},
          {c:'#ffffff',e:'#e6e8f2',h:10,d:'wave'},{c:'#ff3d5a',e:'#c4142f',h:10,d:'dots'}]},
 {id:'icecream',name:'Мороженое',price:400,sky:['#6fe3c8','#dcfff5'],table:'#4a8ad9',
  base:{c:'#e2a654',e:'#b97a2c',h:16,d:'grid',r:5},
  layers:[{c:'#ffb3c7',e:'#f07f9e',h:16,d:'drip'},{c:'#a8f0d1',e:'#5fcf9f',h:16,d:'drip'},{c:'#7a4a32',e:'#53301d',h:16,d:'drip'},
          {c:'#fff5d6',e:'#ead79f',h:16,d:'drip'},{c:'#e2a654',e:'#b97a2c',h:8,d:'grid'}]},
];
const BASE_W=220, HOVER=70, PERF=5;
const SKY_STAGES=[[25,['#ff9a72','#ffd6a3']],[50,['#2a3478','#6a4ea0']],[80,['#070a24','#22164d']]];
const MILESTONES={20:'Выше облаков!',40:'Над самолётами!',60:'Привет, космос!',100:'Ты на Луне!'};
const COMBO_WORDS={5:'Шеф-повар!',10:'Легенда кухни!',15:'Неудержимо!',20:'Мастер башен!'};
const CONFETTI=['#ff4d3d','#ffc42e','#4cc35a','#4aa8ff','#b07cff','#ff8fc2'];

/* ---------- saved progress (this device) ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const P=Object.assign({best:0,bestY:0,coins:0,owned:['burger'],theme:'burger',sfx:true,music:true,games:0,totalFloors:0,perfects:0,bestCombo:0,daily:{day:0,best:0}},store.get('bb_save',{}));
// carry over progress from the earlier version of the game
if(!store.get('bb_save',null)){P.best=store.get('bb_best',0);P.bestY=store.get('bb_bestY',0);P.coins=store.get('bb_coins',0);P.owned=store.get('bb_owned',['burger']);P.theme=store.get('bb_theme','burger')}
if(!P.owned.includes(P.theme))P.theme='burger';

const theme=()=>THEMES.find(t=>t.id===P.theme);

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(s,i)=>{const x=Math.sin(s*9301+i*49.297)*43758.5453;return x-Math.floor(x)};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};

/* ---------- audio ---------- */
const AU={ac:null,master:null,mus:null,noise:null};
function ac(){
  try{if(!AU.ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AU.ac=new C();
    AU.master=AU.ac.createGain();AU.master.gain.value=.9;AU.master.connect(AU.ac.destination);
    AU.mus=AU.ac.createGain();AU.mus.gain.value=.5;AU.mus.connect(AU.master);
    const b=AU.ac.createBuffer(1,AU.ac.sampleRate,AU.ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=b}
  if(AU.ac.state==='suspended')AU.ac.resume();return AU.ac}catch(e){return null}
}
function tone(f,dur,o={}){const a=ac();if(!a||(!o.music&&!P.sfx))return;try{
  const t=a.currentTime+(o.delay||0),os=a.createOscillator(),g=a.createGain();os.type=o.type||'triangle';os.frequency.setValueAtTime(f,t);
  if(o.slide)os.frequency.exponentialRampToValueAtTime(f*o.slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||.15,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  os.connect(g).connect(o.music?AU.mus:AU.master);os.start(t);os.stop(t+dur+.02)}catch(e){}}
function noise(dur,o={}){const a=ac();if(!a||!P.sfx)return;try{
  const t=a.currentTime+(o.delay||0),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=AU.noise;
  f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.freq||1200,t);if(o.slide)f.frequency.exponentialRampToValueAtTime((o.freq||1200)*o.slide,t+dur);f.Q.value=o.q||1;
  g.gain.setValueAtTime(o.vol||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(AU.master);s.start(t);s.stop(t+dur+.02)}catch(e){}}
/* kitchen sound kit, all synthesized */
const K={
  // squishy "шлёп": a soft thud whose pitch drops, plus a muffled wet burst
  splat(vol=1,delay=0){tone(190,.16,{type:'sine',vol:.38*vol,slide:.35,delay});noise(.12,{freq:900,slide:.25,vol:.28*vol,type:'lowpass',q:4,delay});noise(.05,{freq:2400,vol:.06*vol,delay:delay+.01})},
  // knife "вжик" and a tap on the cutting board
  knife(delay=0){noise(.16,{freq:2500,slide:2.6,vol:.2,q:6,delay});noise(.03,{freq:1800,vol:.25,q:2,delay:delay+.15});tone(420,.05,{type:'triangle',vol:.12,slide:.6,delay:delay+.15})},
  // crispy "хрусь": a quick run of tiny noise grains
  crunch(n=5,delay=0){for(let i=0;i<n;i++)noise(.018+Math.random()*.02,{freq:1800+Math.random()*2600,vol:.16+Math.random()*.1,q:3,delay:delay+i*(.022+Math.random()*.02)})},
  // service counter bell "дзынь": bright partials that ring out
  bell(f=2093,vol=.12,delay=0,dur=.9){tone(f,dur,{type:'sine',vol,delay});tone(f*2.76,dur*.6,{type:'sine',vol:vol*.35,delay});tone(f*5.4,dur*.3,{type:'sine',vol:vol*.15,delay})},
  // bubble "бульк" / cork "чпок": a sine that leaps up fast
  pop(f=300,vol=.2,delay=0){tone(f,.07,{type:'sine',vol,slide:3.2,delay})},
  // frying pan "шшш" with crackles
  sizzle(dur=.9,delay=0){noise(dur,{freq:6500,vol:.07,type:'highpass',delay});for(let i=0;i<10;i++)noise(.012,{freq:3000+Math.random()*4000,vol:.12,q:2,delay:delay+Math.random()*dur*.9})},
  // fizz after a cork
  fizz(dur=1.2,delay=0){for(let i=0;i<22;i++)K.pop(900+Math.random()*1400,.035,delay+Math.random()*dur)}
};
const SFX={
  land(){K.splat()},
  cut(){K.knife()},
  perfect(c){K.crunch(4);K.bell(1568*Math.pow(2,Math.min(c,12)/12),.11,.05)},
  combo(){K.sizzle(1);K.bell(2093,.1,.1);K.bell(2637,.1,.28)},
  milestone(){[0,.22,.44].forEach(d=>K.bell(2349,.12,d,.5));K.bell(3136,.1,.7,1.2)},
  record(){K.pop(180,.35);noise(.08,{freq:1200,vol:.25,delay:.01});K.fizz(1.4,.05);[1568,2093,2637].forEach((f,i)=>K.bell(f,.1,.25+i*.15))},
  over(){K.splat(1.6,0);K.splat(1.2,.18);noise(.5,{freq:5000,vol:.12,type:'highpass',delay:.3});for(let i=0;i<6;i++)noise(.03,{freq:4000+Math.random()*3000,vol:.15,q:4,delay:.3+i*.05+Math.random()*.04});tone(330,.7,{type:'triangle',vol:.07,slide:.6,delay:.4})},
  fall(){noise(.4,{freq:1200,slide:.35,vol:.08,q:2,delay:.02})},
  click(){K.pop(420,.16)},
  buy(){noise(.06,{freq:900,vol:.2,q:2});K.bell(2637,.12,.06,.5);K.bell(3520,.1,.16,.8)},
  start(){K.pop(260,.18);K.pop(340,.16,.09);K.pop(450,.14,.18)}
};
SFX.creak=()=>{tone(90,.55,{type:'sawtooth',vol:.06,slide:1.8});noise(.5,{freq:300,slide:2.2,vol:.14,q:8});tone(140,.3,{type:'square',vol:.03,slide:.7,delay:.25})};
SFX.thud=k=>{K.splat(.35+k*.9);if(k>.45)K.crunch(2+Math.round(k*3))};
SFX.crash=()=>{noise(.45,{freq:5200,vol:.12,type:'highpass'});for(let i=0;i<5;i++)noise(.03,{freq:4200+Math.random()*3000,vol:.13,q:4,delay:.03+i*.05})};
SFX.sad=()=>{tone(392,.22,{type:'triangle',vol:.08});tone(330,.22,{type:'triangle',vol:.08,delay:.2});tone(262,.7,{type:'triangle',vol:.08,delay:.4,slide:.8})};
/* background music: a small loop that speeds up as the tower grows */
const MEL=[0,null,4,7, 9,null,7,4, 2,null,4,null, 7,9,12,null, 9,null,7,4, 2,4,0,null, 4,null,2,0, -3,null,0,null];
const BASS=[0,0,-5,-5,-3,-3,-5,-5];
const MUS={on:false,next:0,step:0,timer:null};
function musicStart(){if(!P.music||MUS.on)return;const a=ac();if(!a)return;MUS.on=true;MUS.next=a.currentTime+.08;MUS.step=0;MUS.timer=setInterval(musicTick,40)}
function musicStop(){MUS.on=false;clearInterval(MUS.timer);MUS.timer=null}
function musicTick(){const a=AU.ac;if(!a||!MUS.on)return;
  const bpm=108+Math.min(G?G.floors:0,50)*0.9,st=60/bpm/2;
  while(MUS.next<a.currentTime+.15){const s=MUS.step%32,dl=MUS.next-a.currentTime,root=262;
    if(MEL[s]!==null)tone(root*Math.pow(2,MEL[s]/12),st*1.6,{music:true,vol:.09,delay:dl});
    if(s%4===0)tone(root/2*Math.pow(2,BASS[(s/4)%8]/12),st*3.4,{music:true,type:'sine',vol:.16,delay:dl});
    if(s%2===1){const a2=AU.ac,t=a2.currentTime+dl,src=a2.createBufferSource(),f=a2.createBiquadFilter(),g=a2.createGain();src.buffer=AU.noise;f.type='highpass';f.frequency.value=8000;g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);src.connect(f).connect(g).connect(AU.mus);src.start(t);src.stop(t+.05)}
    MUS.next+=st;MUS.step++}}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
let wake=null;
async function keepAwake(on){try{if(on&&navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}else if(!on&&wake){await wake.release();wake=null}}catch(e){wake=null}}

/* ---------- drawing a layer ---------- */
function drawLayer(c,L,x,y,w,h,seed,k){
  if(w<1||h<1)return;
  const r=Math.min(h/2,(L.r||7)*k,w/2);
  if(L.d==='drip'||L.d==='wave'){
    c.fillStyle=L.c;const n=Math.max(2,Math.round(w/(18*k)));
    for(let i=0;i<n;i++){const q=hash(seed,i),px=x+(i+.5)*w/n;
      if(L.d==='drip'){if(q>.4){c.beginPath();c.roundRect(px-3.2*k,y+h-5*k,6.4*k,(5+q*10)*k,3.2*k);c.fill()}}
      else{c.beginPath();c.arc(px,y+h-1.5*k,Math.min(w/n*.42,7*k),0,Math.PI);c.fill()}}
  }
  c.save();c.beginPath();c.roundRect(x,y,w,h,r);c.clip();
  c.fillStyle=L.c;c.fillRect(x,y,w,h);
  c.fillStyle=L.e;c.fillRect(x,y+h*.66,w,h);
  c.fillStyle='rgba(255,255,255,.38)';c.fillRect(x,y+Math.max(1,h*.14),w,Math.max(1.5,h*.12));
  const n=Math.max(1,Math.floor(w/(15*k)));
  if(L.d==='sesame'){c.fillStyle='#fff7e0';for(let i=0;i<n;i++){const q=hash(seed,i+7);c.beginPath();c.ellipse(x+(i+.5)*w/n,y+h*(.28+q*.18),2.6*k,1.5*k,q*2,0,7);c.fill()}}
  if(L.d==='seeds'){c.fillStyle='#ffe08a';for(let i=0;i<n;i++){const q=hash(seed,i+3);c.beginPath();c.arc(x+(i+.5)*w/n,y+h*(.38+q*.2),1.8*k,0,7);c.fill()}}
  if(L.d==='grill'){c.strokeStyle='rgba(0,0,0,.28)';c.lineWidth=2.2*k;for(let gx=x-h;gx<x+w;gx+=14*k){c.beginPath();c.moveTo(gx,y+h);c.lineTo(gx+h,y);c.stroke()}}
  if(L.d==='ring'){c.strokeStyle='rgba(150,110,200,.45)';c.lineWidth=1.5*k;c.beginPath();c.moveTo(x,y+h*.5);c.lineTo(x+w,y+h*.5);c.stroke()}
  if(L.d==='dots'){c.fillStyle=L.e;for(let i=0;i<n;i++){const q=hash(seed,i+11);c.beginPath();c.arc(x+(i+.5)*w/n,y+h*.48,h*(.22+q*.08),0,7);c.fill()}}
  if(L.d==='grid'){c.strokeStyle='rgba(0,0,0,.2)';c.lineWidth=1.4*k;for(let gx=x+6*k;gx<x+w;gx+=10*k){c.beginPath();c.moveTo(gx,y);c.lineTo(gx,y+h);c.stroke()}c.beginPath();c.moveTo(x,y+h/2);c.lineTo(x+w,y+h/2);c.stroke()}
  c.restore();
  c.strokeStyle='rgba(27,33,64,.55)';c.lineWidth=Math.max(1,1.6*k);c.beginPath();c.roundRect(x,y,w,h,r);c.stroke();
}

/* ---------- canvas & sizing ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,U=1,Wd=400,G=null,last=0;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  U=Math.min(W,H*(W>H&&H<540?.8:.62))/400;Wd=W/U;
  if(G){const dx=Wd/2-G.cx;G.cx=Wd/2;for(const p of G.pieces)p.x+=dx;for(const d of G.debris)d.x+=dx;for(const q of G.parts)q.x+=dx;if(G.mv)G.mv.x+=dx}
}
addEventListener('resize',resize);if(window.visualViewport)visualViewport.addEventListener('resize',resize);

const hero=$('hero'),hctx=hero.getContext('2d');let heroT0=performance.now(),heroJig=-1e9;
function heroStack(){const T=theme();return[T.base,...T.layers.slice(0,4),T.id==='burger'?{c:'#eaa24c',e:'#c4792a',h:30,d:'sesame',r:15}:T.layers[0]]}
function drawHero(now){
  if($('menu').hidden||!hero.offsetWidth)return;
  const d=Math.min(devicePixelRatio||1,2),w=hero.clientWidth,h=hero.clientHeight;
  if(hero.width!==Math.round(w*d)||hero.height!==Math.round(h*d)){hero.width=Math.round(w*d);hero.height=Math.round(h*d)}
  const c=hctx;c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h);
  const seq=heroStack(),tot=seq.reduce((a,l)=>a+l.h,0),k=Math.min(1.1,96/tot),bw=150*k*1.15,floor=110,cx=w/2;
  const t=(now-heroT0)/1000,jt=(now-heroJig)/1000;
  const sh=Math.min(1,t/(.15+seq.length*.13));c.fillStyle=`rgba(27,33,64,${.18*sh})`;c.beginPath();c.ellipse(cx,floor+5,bw*.55,7,0,0,7);c.fill();
  c.save();c.translate(cx,floor);c.rotate(REDUCE?0:Math.sin(now/650)*.025);
  let y=0;seq.forEach((L,i)=>{const lh=L.h*k,tl=.15+i*.13,p=Math.max(0,Math.min(1,(t-tl+.32)/.32));
    if(p<=0){y-=lh;return}
    const drop=REDUCE?0:(1-p*p)*150,sq=REDUCE?0:Math.max(0,1-(t-tl)/.18)*(t>tl?1:0);
    const jig=jt<1.2&&!REDUCE?Math.sin(jt*24-i*.7)*Math.exp(-jt*4)*7*(i+1)/seq.length:0;
    const ww=(i===seq.length-1?bw*.94:bw)*(1+sq*.12),hh=lh*(1-sq*.3);
    y-=lh;drawLayer(c,L,-ww/2+jig,y+(lh-hh)-drop,ww,hh,i*3+2,k);});
  c.restore()}

/* ---------- game ---------- */
function newGame(daily){
  const t=theme();
  G={daily,rng:daily?mulberry(dayNum*7919+11):Math.random,cx:Wd/2,camY:0,pieces:[],debris:[],fx:[],parts:[],markers:[],
     floors:0,perfect:0,combo:0,maxCombo:0,earned:0,sway:0,swayV:0,shake:0,flash:0,skyF:0,banner:null,recordShown:false,
     over:false,overT:0,paused:false,running:true,mv:null,dir:1,t:0,bodies:[],tip:null,hm:{},peak:null,impN:0,lastImp:-1,sadPlayed:false};
  G.pieces.push({x:G.cx-BASE_W/2,w:BASE_W,y:0,h:t.base.h,L:t.base,seed:1,sq:0});
  spawn();
}
const top=()=>G.pieces[G.pieces.length-1];
function spawn(){
  const t=theme(),tp=top(),L=t.layers[Math.floor(G.rng()*t.layers.length)];
  G.dir*=-1;const rg=Math.min(Wd/2-6,260),w=tp.w;
  G.mv={L,w,h:L.h,seed:Math.floor(G.rng()*1e6),y:tp.y+tp.h+HOVER,x:G.dir>0?G.cx-rg:G.cx+rg-w,dir:G.dir,falling:false,rg};
}
const speed=()=>Math.min(480,170+G.floors*7);
function drop(){if(!G||!G.running||G.paused||G.over||!G.mv||G.mv.falling)return;G.mv.falling=true;G.mv.vy=0;$('tip').hidden=true}
function burst(x,y,n,cols,kind,power){
  if(REDUCE)n=Math.ceil(n/3);
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(power||1)*(80+Math.random()*220);
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.abs(Math.sin(a))*s*(kind==='confetti'?1.4:.8)+60,age:0,life:kind==='confetti'?1.6:.7+Math.random()*.4,
      col:cols[Math.floor(Math.random()*cols.length)],size:kind==='confetti'?5+Math.random()*5:2+Math.random()*3.5,kind,rot:Math.random()*6,vr:(Math.random()-.5)*14})}
}
function banner(txt,col){G.banner={txt,age:0,col:col||'#ffc42e'}}
function land(){
  const m=G.mv,tp=top();
  const a=Math.max(m.x,tp.x),b=Math.min(m.x+m.w,tp.x+tp.w),ov=b-a;
  if(ov<=0){const miss={...m};G.mv=null;gameOver(m.x<tp.x?-1:1,miss);return}
  const off=m.x-tp.x,ly=tp.y+tp.h;
  if(Math.abs(off)<=PERF){

    c.fillStyle='#5fbf4a';c.beginPath();c.ellipse(s*.05,s*.14,s*.06,s*.03,.6,0,7);c.fill();return{ex:s*.28,ey:-s*.08}}
  if(kind==='cupcake'){c.beginPath();c.moveTo(-s*.38,0);c.lineTo(s*.38,0);c.lineTo(s*.28,s*.5);c.lineTo(-s*.28,s*.5);c.closePath();c.fillStyle='#4aa8ff';c.fill();c.stroke();
    c.strokeStyle='rgba(255,255,255,.55)';for(let i=-2;i<=2;i++){c.beginPath();c.moveTo(i*s*.13,s*.04);c.lineTo(i*s*.1,s*.46);c.stroke()}c.strokeStyle=ol;
    c.fillStyle='#ffd1e3';for(const[px,py,r]of[[-.25,-.05,.22],[.25,-.05,.22],[0,-.12,.27],[0,-.36,.2]]){c.beginPath();c.arc(px*s,py*s,r*s,0,7);c.fill();c.stroke()}
    c.fillStyle='#ffd1e3';c.beginPath();c.ellipse(0,-s*.08,s*.38,s*.14,0,0,7);c.fill();
    c.fillStyle='#e0203a';c.beginPath();c.arc(0,-s*.6,s*.1,0,7);c.fill();c.stroke();return{ex:s*.22,ey:-s*.2}}

  c.beginPath();c.moveTo(0,-s*.6);c.quadraticCurveTo(s*.12,-s*.62,s*.58,s*.3);c.quadraticCurveTo(s*.6,s*.48,s*.4,s*.48);c.lineTo(-s*.4,s*.48);c.quadraticCurveTo(-s*.6,s*.48,-s*.58,s*.3);c.quadraticCurveTo(-s*.12,-s*.62,0,-s*.6);

function drawBird(b,t,y){const s=b.sz,fl=Math.sin(t*b.fl+b.ph);ctx.save();ctx.translate(b.x,y+Math.sin(t*2.2+b.ph)*s*.18-fl*s*.05);ctx.scale(b.dir,1);ctx.rotate(-fl*.05);

  if(blink){ctx.beginPath();ctx.moveTo(e.ex-s*.09,e.ey);ctx.lineTo(e.ex+s*.09,e.ey);ctx.stroke()}
  else{ctx.fillStyle='#1b2140';ctx.beginPath();ctx.arc(e.ex+s*.04,e.ey+s*.01,s*.065,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.ex+s*.06,e.ey-s*.02,s*.022,0,7);ctx.fill()}

function skyColors(T,f){

function draw(t){
  const T=theme(),f=G?G.skyF:0,[c0,c1]=skyColors(T,f),night=Math.max(0,Math.min(1,(f-35)/25));
  ctx.save();
  if(G&&G.shake>0&&!REDUCE)ctx.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c0);g.addColorStop(1,c1);ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  const cam=G?G.camY:0;
  if(night>0){for(let i=0;i<80;i++){const sx=hash(3,i)*W,sy=((hash(5,i)*H*1.5+cam*U*.08)%(H*1.5))-H*.25,tw=.6+.4*Math.sin(t*2+i);
    ctx.globalAlpha=night*tw*(.5+hash(7,i)*.5);ctx.fillStyle='#fff';ctx.fillRect(sx,sy,hash(9,i)>.85?2.5:1.5,hash(9,i)>.85?2.5:1.5)}ctx.globalAlpha=1}
  drawClouds(t,cam,f,night,CLOUD_LAYERS);
  drawBirds(t,cam);
  const ground=H-70*U+cam*U,sx=x=>x*U,sy=y=>ground-y*U;
  ctx.fillStyle=T.table;ctx.fillRect(-20,ground,W+40,H+40);ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(-20,ground,W+40,6*U);
  ctx.strokeStyle='rgba(27,33,64,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-20,ground);ctx.lineTo(W+20,ground);ctx.stroke();
  if(!G){ctx.restore();return}
  ctx.font=`900 ${Math.round(13*Math.max(1,U))}px Rubik, sans-serif`;ctx.textBaseline='bottom';
  if(P.bestY>0&&P.best>0&&!G.recordShown){const y=sy(P.bestY);if(y>-20&&y<H){ctx.setLineDash([10,8]);ctx.strokeStyle='rgba(255,77,61,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=night>.4?'#ff9a8f':'#c9291b';ctx.textAlign='left';ctx.fillText(`Рекорд ${P.best}`,12,y-4)}}
  for(const mk of G.markers){const y=sy(mk.y);if(y<-20||y>H)continue;ctx.fillStyle=night>.4?'rgba(255,255,255,.7)':'rgba(27,33,64,.55)';ctx.textAlign='right';ctx.fillText(`${mk.n} эт.`,W-12,y-4);ctx.fillRect(W-60,y,48,2)}
  const pivX=sx(G.cx),pivY=ground;
  ctx.save();ctx.translate(pivX,pivY);ctx.rotate(G.sway);ctx.translate(-pivX,-pivY);
  for(const p of G.pieces){const y=sy(p.y+p.h);if(y>H+40||y<-60)continue;
    if(p.sq>0){const s=Math.sin(p.sq*Math.PI)*.35*p.sq,w=p.w*U*(1+s*.25),h=p.h*U*(1-s*.45);drawLayer(ctx,p.L,sx(p.x+p.w/2)-w/2,sy(p.y)-h,w,h,p.seed,U)}
    else drawLayer(ctx,p.L,sx(p.x),y,p.w*U,p.h*U,p.seed,U)}
  if(G.tip){const T=G.tip,px=sx(T.px),py=sy(T.py);ctx.save();ctx.translate(px,py);ctx.rotate(T.dir*T.phi);ctx.translate(-px,-py);
    for(const p of T.seg)drawLayer(ctx,p.L,sx(p.x),sy(p.y+p.h),p.w*U,p.h*U,p.seed,U);ctx.restore()}
  for(const fx of G.fx)if(fx.ring&&fx.age<.4){const a=1-fx.age/.4,gr=fx.age*40;ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(sx(fx.ring.x)-gr,sy(fx.ring.y+fx.ring.h)-gr,fx.ring.w*U+gr*2,fx.ring.h*U+gr*2,10);ctx.stroke()}
  ctx.restore();
  if(G.mv){const m=G.mv;
    if(!m.falling){const tp=top();ctx.fillStyle='rgba(27,33,64,.14)';ctx.fillRect(sx(m.x),sy(tp.y+tp.h)-2,m.w*U,3)}
    if(G.combo>=3){ctx.save();ctx.shadowColor='#ffd23f';ctx.shadowBlur=18+6*Math.sin(t*8);drawLayer(ctx,m.L,sx(m.x),sy(m.y+m.h),m.w*U,m.h*U,m.seed,U);ctx.restore()}
    drawLayer(ctx,m.L,sx(m.x),sy(m.y+m.h),m.w*U,m.h*U,m.seed,U)}
  for(const d of G.debris){const cx=sx(d.x+d.w/2),cy=sy(d.y+d.h/2);ctx.save();ctx.translate(cx,cy);ctx.rotate(d.rot);drawLayer(ctx,d.L,-d.w*U/2,-d.h*U/2,d.w*U,d.h*U,d.seed,U);ctx.restore()}
  for(const b of G.bodies){const cy=sy(b.y);if(cy>H+80||cy<-120)continue;ctx.save();ctx.translate(sx(b.x),cy);ctx.rotate(b.a);drawLayer(ctx,b.L,-b.w*U/2,-b.h*U/2,b.w*U,b.h*U,b.seed,U);ctx.restore()}
  drawClouds(t,cam,f,night,CLOUD_FRONT);
  for(const q of G.parts){const a=Math.max(0,1-q.age/q.life),x=sx(q.x),y=sy(q.y);ctx.globalAlpha=a;ctx.fillStyle=q.col;
    if(q.kind==='confetti'){ctx.save();ctx.translate(x,y);ctx.rotate(q.rot);ctx.fillRect(-q.size/2*U,-q.size/4*U,q.size*U,q.size/2*U);ctx.restore()}
    else if(q.kind==='star'){const r=q.size*U*1.4;ctx.beginPath();for(let i=0;i<8;i++){const rr=i%2?r*.4:r,an=q.rot+i*Math.PI/4;ctx.lineTo(x+Math.cos(an)*rr,y+Math.sin(an)*rr)}ctx.fill()}
    else{ctx.beginPath();ctx.arc(x,y,q.size*U,0,7);ctx.fill()}}
  ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  for(const fx of G.fx){const a=Math.min(1,(.9-fx.age)*3),s=Math.round(22*Math.max(1,U)*(1+.3*Math.max(0,.15-fx.age)/.15));
    ctx.globalAlpha=a;ctx.font=`900 ${s}px Rubik, sans-serif`;ctx.lineWidth=5;ctx.strokeStyle='#1b2140';const y=sy(fx.y)-16-fx.age*50;
    ctx.strokeText(fx.txt,sx(fx.x),y);ctx.fillStyle='#ffc42e';ctx.fillText(fx.txt,sx(fx.x),y);ctx.globalAlpha=1}
  if(G.banner){const b=G.banner,inT=Math.min(1,b.age/.25),out=Math.min(1,(1.8-b.age)/.3),sc=REDUCE?1:.6+.4*(1-Math.pow(1-inT,3))+(inT>=1?.04*Math.sin(b.age*10):0);
    ctx.save();ctx.globalAlpha=Math.max(0,out);ctx.translate(W/2,H*.3);ctx.scale(sc,sc);ctx.rotate(-.04);
    const fs=Math.round(Math.min(W/11,40*Math.max(1,U)));ctx.font=`900 ${fs}px Rubik, sans-serif`;ctx.lineWidth=fs*.22;ctx.strokeStyle='#1b2140';ctx.strokeText(b.txt,0,0);ctx.fillStyle=b.col;ctx.fillText(b.txt,0,0);ctx.restore()}
  ctx.restore();
  if(G.flash>0){ctx.fillStyle=`rgba(255,255,255,${G.flash*.5})`;ctx.fillRect(0,0,W,H)}
  $('hFloors').textContent=G.floors;$('hCoins').textContent=P.coins+G.earned;
}

/* ---------- share card ---------- */
function shareCard(record){
  const T=theme(),c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');
  const [c0,c1]=skyColors(T,G.floors*.6);const g=x.createLinearGradient(0,0,0,1350);g.addColorStop(0,c0);g.addColorStop(1,c1);x.fillStyle=g;x.fillRect(0,0,1080,1350);
  {const cs=cloudSet('day');[[20,150,1.15,0],[640,90,.95,1],[600,430,.8,2],[60,520,.7,3]].forEach(([a,b,k,i])=>{x.globalAlpha=.95;x.drawImage(cs[i],a,b,440*k,210*k)});x.globalAlpha=1}
  const area={top:330,bottom:1150},ps=G.peak||G.pieces;
  const minX=Math.min(...ps.map(p=>p.x)),maxX=Math.max(...ps.map(p=>p.x+p.w)),tp=ps[ps.length-1],th=tp.y+tp.h;
  const k=Math.min(3.2,(area.bottom-area.top)/th,860/(maxX-minX)),ox=540-((minX+maxX)/2)*k;
  x.fillStyle=T.table;x.fillRect(0,area.bottom,1080,200);x.strokeStyle='rgba(27,33,64,.5)';x.lineWidth=4;x.beginPath();x.moveTo(0,area.bottom);x.lineTo(1080,area.bottom);x.stroke();
  for(const p of ps)drawLayer(x,p.L,ox+p.x*k,area.bottom-(p.y+p.h)*k,p.w*k,p.h*k,p.seed,k);
  x.textAlign='center';x.textBaseline='alphabetic';x.lineJoin='round';
  const outl=(txt,yy,size,fill)=>{x.font=`900 ${size}px Rubik, sans-serif`;x.lineWidth=size*.16;x.strokeStyle='#1b2140';x.strokeText(txt,540,yy);x.fillStyle=fill;x.fillText(txt,540,yy)};
  outl('БУТЕРБАШНЯ',120,64,'#ffc42e');outl(`${G.floors} ${plural(G.floors)}`,250,110,'#ffffff');
  x.font='700 40px Rubik, sans-serif';x.fillStyle='#ffffff';
  x.fillText(record&&G.floors>0?'Новый рекорд! Побьёшь?':(G.daily?`Вызов дня #${dayNum}. Побьёшь?`:'Побьёшь мой результат?'),540,1250);
  return c.toDataURL('image/png');
}

/* ---------- flow ---------- */
function startGame(daily){
  $('menu').hidden=true;$('over').hidden=true;$('paused').hidden=true;$('hud').hidden=false;$('tip').hidden=false;
  newGame(daily);keepAwake(true);SFX.start();musicStart();
}
function toMenu(){heroT0=performance.now();G=null;musicStop();$('hud').hidden=true;$('tip').hidden=true;$('over').hidden=true;$('paused').hidden=true;$('menu').hidden=false;keepAwake(false);renderMenu()}
function pause(){if(!G||!G.running||G.paused||G.over)return;G.paused=true;musicStop();$('paused').hidden=false;keepAwake(false)}
function resume(){if(!G||!G.paused)return;G.paused=false;$('paused').hidden=true;keepAwake(true);musicStart()}
$('playBtn').onclick=()=>startGame(false);$('dailyBtn').onclick=()=>startGame(true);
$('againBtn').onclick=()=>startGame(G?G.daily:false);$('menuBtn').onclick=()=>{SFX.click();toMenu()};
$('pauseBtn').onclick=pause;$('resumeBtn').onclick=resume;$('quitBtn').onclick=toMenu;
$('copyBtn').onclick=()=>{
  const txt=`Построил Бутербашню на ${G.floors} ${plural(G.floors)}${G.daily?` (вызов дня #${dayNum})`:''}. Побьёшь?`;
  const ok=()=>{$('copyBtn').textContent='Скопировано'},bad=()=>{$('copyBtn').textContent=txt};
  try{navigator.clipboard.writeText(txt).then(ok,bad)}catch(e){bad()}
};
cv.addEventListener('pointerdown',e=>{e.preventDefault();drop()});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){if(G&&G.running&&!G.paused&&$('over').hidden&&$('menu').hidden){e.preventDefault();drop()}}
  if(e.key==='Escape'||e.key==='p'||e.key==='з'){G&&G.paused?resume():pause()}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

resize();renderMenu();last=performance.now();requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(renderMenu);
})();
